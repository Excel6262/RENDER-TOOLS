<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Cpath d='M14 2 26 8 14 14 2 8z' fill='%232563EB'/%3E%3Cpath d='M2 13.5 14 19.5 26 13.5' fill='none' stroke='%237C3AED' stroke-width='2.5'/%3E%3C/svg%3E">
<title>Render Tools – Everyday Tools. Rendered Simple.</title>
<meta name="description" content="Free online tools that run in your browser: image compressor, resizer, PDF merger, QR code generator, word counter and more.">
<style>
:root{--p:#2563EB;--a:#7C3AED;--bg:#fff;--bg2:#F3F4F6;--tx:#111827;--tx2:#4B5563;--bd:#E5E7EB;--ok:#047857;--er:#B91C1C;--bt:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0B1020;--bg2:#161C30;--tx:#F3F4F6;--tx2:#A8B0C0;--bd:#2A3350;--p:#6C9BFF;--a:#A78BFA;--ok:#34D399;--er:#F87171;--bt:#0B1020}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0B1020;--bg2:#161C30;--tx:#F3F4F6;--tx2:#A8B0C0;--bd:#2A3350;--p:#6C9BFF;--a:#A78BFA;--ok:#34D399;--er:#F87171;--bt:#0B1020}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--p)}:focus-visible{outline:3px solid var(--a);outline-offset:2px}
header{border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--bg);z-index:5}
.w{max-width:1040px;margin:0 auto;padding:0 16px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--tx);text-decoration:none}
nav a{margin-left:14px;color:var(--tx);text-decoration:none;font-weight:500}nav a:hover{color:var(--p)}
.hero{text-align:center;padding:48px 0 28px}
h1{font-size:clamp(1.8rem,5vw,2.8rem);line-height:1.15;margin:0 0 12px}
.g{background:linear-gradient(90deg,var(--p),var(--a));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--tx2);max-width:560px;margin:0 auto 20px}
input,select,textarea,button{font:inherit;color:var(--tx)}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--bg)}
textarea{min-height:180px;resize:vertical}label{display:block;font-weight:600;margin:12px 0 4px;font-size:.92rem}
.btn{display:inline-block;background:var(--p);color:var(--bt);border:0;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer;min-height:44px;text-decoration:none}
nav button{margin-left:14px}
.btn.s{background:var(--bg2);color:var(--tx);border:1px solid var(--bd)}.btn:disabled{opacity:.5;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin:20px 0}
.card{display:block;border:1px solid var(--bd);border-radius:12px;padding:16px;text-decoration:none;color:var(--tx);background:var(--bg)}
.card:hover,.card:focus-visible{border-color:var(--p);transform:translateY(-1px)}
.card .ic{display:block;color:var(--p);margin-bottom:6px}.btn svg{width:16px;height:16px;vertical-align:-3px;margin-right:4px}
.card b{display:block}.card span{color:var(--tx2);font-size:.9rem}.ic{font-size:1.5rem}
.soon{opacity:.6;border-style:dashed}.tag{font-size:.72rem;background:var(--bg2);border-radius:99px;padding:2px 8px;margin-left:6px}
.panel{background:var(--bg2);border-radius:12px;padding:18px;margin:16px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.row>*{flex:1 1 140px}
.res{font-size:1.25rem;font-weight:700;margin:12px 0;overflow-wrap:anywhere}
.st{display:flex;gap:12px;flex-wrap:wrap}.st div{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px 14px;min-width:110px}.st b{display:block;font-size:1.3rem}
.err{color:var(--er);font-weight:600}.ok{color:var(--ok);font-weight:600}
.chips button{margin:0 6px 6px 0}.chips .on{background:var(--p);color:var(--bt)}
.drop{border:2px dashed var(--bd);border-radius:12px;padding:24px;text-align:center;background:var(--bg)}.drop.o{border-color:var(--p)}
img.pv,canvas.pv{max-width:100%;height:auto;border:1px solid var(--bd);border-radius:8px;background:#fff}
ul.fl{list-style:none;padding:0}ul.fl li{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd)}ul.fl span{flex:1;overflow-wrap:anywhere}
.crumb{font-size:.9rem;color:var(--tx2);margin-top:16px}.ad{min-height:0;display:none}
footer{border-top:1px solid var(--bd);margin-top:40px;padding:24px 0;color:var(--tx2);font-size:.9rem}footer a{margin-right:14px}
.sr{position:absolute;left:-9999px}a.sr:focus{left:8px;top:8px;z-index:20;background:var(--bg);color:var(--tx);padding:8px 12px;border:2px solid var(--p);border-radius:8px}
.stg{position:relative;display:inline-block;max-width:100%;overflow:hidden;touch-action:none;user-select:none;margin:12px 0}.stg img{display:block;max-width:100%;height:auto}
.cb{position:absolute;border:2px solid #fff;outline:2px solid var(--p);box-shadow:0 0 0 9999px rgba(0,0,0,.55);cursor:move;touch-action:none}.cb i{position:absolute;width:22px;height:22px;background:var(--p);border:2px solid #fff;border-radius:50%}
.cb i[data-c=nw]{left:0;top:0;cursor:nwse-resize}.cb i[data-c=ne]{right:0;top:0;cursor:nesw-resize}.cb i[data-c=sw]{left:0;bottom:0;cursor:nesw-resize}.cb i[data-c=se]{right:0;bottom:0;cursor:nwse-resize}
h1,h2,h3{color:var(--tx);text-wrap:balance}
h1{font-weight:800;letter-spacing:-.025em;line-height:1.1}
main>h1{font-size:clamp(1.9rem,4.5vw,2.6rem);margin:10px 0 8px}
main>h1::after{content:"";display:block;width:56px;height:4px;border-radius:4px;margin-top:14px;background:linear-gradient(90deg,var(--p),var(--a))}
.hero h1{font-size:clamp(2.1rem,6vw,3.4rem);letter-spacing:-.03em}
h2{font-size:1.45rem;font-weight:700;letter-spacing:-.015em;line-height:1.25;margin:2.2rem 0 .6rem}
main>p,main>ul,main>ol,main>h2{max-width:72ch}
main>p.sub{margin:0 0 16px;max-width:72ch}
/* clean interface layer */
body{line-height:1.65}main{padding-bottom:24px}
.nav{min-height:64px}.nav nav{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px}
nav a{margin-left:0;padding:8px 12px;border-radius:8px}nav a:hover{background:var(--bg2);color:var(--tx)}nav button{margin-left:6px}
.grid{gap:16px}
.card{border-radius:14px;padding:20px}.card:hover,.card:focus-visible{transform:none;box-shadow:0 6px 18px rgba(17,24,39,.08)}.card .ic{margin-bottom:10px}.card b{margin-bottom:4px}
.panel{border-radius:14px;padding:20px}
#tool.panel{background:var(--bg);border:1px solid var(--bd);padding:24px}
.panel .panel{background:var(--bg2);border:0;margin:14px 0}.panel .res{background:var(--bg);border-radius:10px;padding:10px 14px}.res:empty{display:none}
.btn{border-radius:10px}.btn:hover{filter:brightness(1.07)}.btn.s:hover{border-color:var(--p);filter:none}
input[type=text],input[type=number],input[type=date],select,textarea{border-radius:10px;min-height:44px}input:hover,select:hover,textarea:hover{border-color:var(--tx2)}input:focus,select:focus,textarea:focus{border-color:var(--p)}
.st div{background:var(--bg2);border:0;border-radius:10px}.panel .st div{background:var(--bg)}
.drop{background:var(--bg2);border-color:var(--bd);border-radius:14px}.drop.o{background:var(--bg)}
ul.fl li{padding:10px 0}
.hero{padding:56px 0 36px}.hero #q{display:block;margin:0 auto;padding:14px 18px;border-radius:12px;font-size:1.05rem}.hero .chips{margin-top:18px}
.crumb{margin:20px 0 4px}
main p a,main li a{text-underline-offset:3px}
footer{margin-top:56px;padding:28px 0}footer p:first-child{display:flex;flex-wrap:wrap;gap:8px 20px;margin:0 0 12px}footer a{margin:0;color:var(--tx2);text-decoration:none}footer a:hover{color:var(--p);text-decoration:underline}
.hello{display:inline-block;margin:0 0 16px;padding:4px 14px;border-radius:99px;background:var(--bg2);color:var(--tx2);font-size:.95rem;font-weight:600}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media(prefers-reduced-motion:no-preference){.card{transition:.15s}}
</style>

<header><div class="w nav">
<a class="logo" href="#home" aria-label="Render Tools home"><svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563EB"/><stop offset="1" stop-color="#7C3AED"/></linearGradient></defs><path d="M14 2 26 8 14 14 2 8z" fill="url(#lg)"/><path d="M2 13.5 14 19.5 26 13.5" fill="none" stroke="url(#lg)" stroke-width="2.5"/><path d="M2 19 14 25 26 19" fill="none" stroke="url(#lg)" stroke-width="2.5" opacity=".6"/></svg>Render Tools</a>
<nav aria-label="Main"><a href="#home">Home</a><a href="#tools">All Tools</a><a href="#guides">Guides</a><a href="#privacy">Privacy</a><a href="#about">About</a><button type="button" class="btn s" id="th"></button></nav>
</div></header>
<main id="main" class="w" tabindex="-1"></main>
<footer><div class="w"><p><a href="#tools">All tools</a><a href="#guides">Guides</a><a href="#about">About</a><a href="#contact">Contact</a><a href="#privacy">Privacy policy</a><a href="#terms">Terms</a><a href="#cookies">Cookie policy</a><a href="#disclaimer">Disclaimer</a></p><p id="yr"></p></div></footer>
<div id="live" class="sr" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script>
const $=(s,e=document)=>e.querySelector(s),$$=(s,e=document)=>[...e.querySelectorAll(s)];
const say=t=>{$('#live').textContent=t};
const fmtB=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(2)+' MB';
const clean=n=>Number(Number(n).toPrecision(10));
const copy=async(t,b)=>{try{await navigator.clipboard.writeText(t);b.textContent='Copied';say('Copied')}catch{b.textContent='Copy failed'}};
function dl(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);say('Download started')}
function drop(el,accept,multi,cb){el.innerHTML=`<p><b>Drag files here</b> or</p><label class="btn s" style="display:inline-block;margin:0">Choose file${multi?'s':''}<input type="file" class="sr" accept="${accept}" ${multi?'multiple':''}></label>`;
 const inp=$('input',el);inp.onchange=()=>{cb([...inp.files]);inp.value=''};
 el.ondragover=e=>{e.preventDefault();el.classList.add('o')};el.ondragleave=()=>el.classList.remove('o');
 el.ondrop=e=>{e.preventDefault();el.classList.remove('o');cb([...e.dataTransfer.files])}}
const num=v=>v.trim()===''?NaN:Number(v);

/* ---------- Tools ---------- */
function wordCounter(el){
 el.innerHTML=`<label for="t">Your text</label><textarea id="t" placeholder="Type or paste text here"></textarea>
 <div class="st" style="margin:12px 0" role="status"></div>
 <button class="btn s" id="cp">Copy</button> <button class="btn s" id="pa">Paste</button> <button class="btn s" id="cl">Clear</button>
 <p class="sub" style="margin:12px 0 0;text-align:left">Reading time assumes 200 words per minute. Text stays in your browser.</p>`;
 const t=$('#t',el),st=$('.st',el);
 const up=()=>{const s=t.value,w=(s.trim().match(/\S+/g)||[]).length,p=s.split(/\n\s*\n/).filter(x=>x.trim()).length,c=[...s].length,ns=[...s.replace(/\s/g,'')].length,rt=w?Math.max(1,Math.ceil(w/200)):0;
  st.innerHTML=[['Words',w],['Characters',c],['No spaces',ns],['Paragraphs',p],['Reading time',rt+' min']].map(([k,v])=>`<div>${k}<b>${v}</b></div>`).join('')};
 t.oninput=up;up();
 $('#cp',el).onclick=e=>copy(t.value,e.target);$('#cl',el).onclick=()=>{t.value='';up();t.focus()};
 $('#pa',el).onclick=async()=>{try{t.value=await navigator.clipboard.readText();up()}catch{say('Paste blocked. Use Ctrl+V in the box.')}}}
function caseConverter(el){
 const T={upper:s=>s.toUpperCase(),lower:s=>s.toLowerCase(),title:s=>s.toLowerCase().replace(/(^|[\s\-(“"])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase()),
  sentence:s=>s.toLowerCase().replace(/(^\s*|[.!?]\s+)(\p{L})/gu,(m,a,b)=>a+b.toUpperCase()),
  alt:s=>{let i=0;return [...s].map(c=>/\p{L}/u.test(c)?(i++%2?c.toUpperCase():c.toLowerCase()):c).join('')}};
 el.innerHTML=`<label for="t">Your text</label><textarea id="t"></textarea><div class="chips" style="margin-top:12px">
 ${Object.entries({upper:'UPPERCASE',lower:'lowercase',title:'Title Case',sentence:'Sentence case',alt:'aLtErNaTiNg'}).map(([k,v])=>`<button class="btn s" data-k="${k}">${v}</button>`).join('')}</div>
 <button class="btn s" id="cp">Copy</button> <button class="btn s" id="cl">Clear</button>
 <p class="sub" style="text-align:left">Case rules follow Unicode. Some languages (e.g. Turkish dotted i, German ß) have special cases that may not convert as a native speaker expects. Punctuation is never changed.</p>`;
 const t=$('#t',el);$$('[data-k]',el).forEach(b=>b.onclick=()=>{t.value=T[b.dataset.k](t.value);say('Converted')});
 $('#cp',el).onclick=e=>copy(t.value,e.target);$('#cl',el).onclick=()=>{t.value='';t.focus()}}
function pctCalc(el){
 el.innerHTML=`<div class="panel"><b>What is X% of Y?</b><div class="row"><div><label for="a1">X (%)</label><input id="a1" type="number" step="any"></div><div><label for="b1">Y</label><input id="b1" type="number" step="any"></div></div><p class="res" id="r1" aria-live="polite"></p></div>
 <div class="panel"><b>X is what percent of Y?</b><div class="row"><div><label for="a2">X</label><input id="a2" type="number" step="any"></div><div><label for="b2">Y</label><input id="b2" type="number" step="any"></div></div><p class="res" id="r2" aria-live="polite"></p></div>
 <div class="panel"><b>Percentage change</b><div class="row"><div><label for="a3">From</label><input id="a3" type="number" step="any"></div><div><label for="b3">To</label><input id="b3" type="number" step="any"></div></div><p class="res" id="r3" aria-live="polite"></p></div>`;
 const f=n=>String(clean(+n.toFixed(6)));
 const calc=(i,fn)=>{const a=num($('#a'+i,el).value),b=num($('#b'+i,el).value),r=$('#r'+i,el);r.className='res';
  if(isNaN(a)||isNaN(b)){r.textContent='Enter both numbers.';r.style.fontWeight=400;return}r.style.fontWeight='';
  const o=fn(a,b);if(o.e){r.textContent=o.e;r.className='res err'}else r.textContent=o.t};
 [1,2,3].forEach(i=>['a','b'].forEach(k=>$('#'+k+i,el).oninput=()=>calc(i,[
  (a,b)=>({t:`${a}% × ${b} ÷ 100 = ${f(a*b/100)}`}),
  (a,b)=>b===0?{e:'Y cannot be zero (division by zero).'}:{t:`${a} ÷ ${b} × 100 = ${f(a/b*100)}%`},
  (a,b)=>a===0?{e:'Percentage change from 0 is undefined.'}:{t:`(${b} − ${a}) ÷ |${a}| × 100 = ${f((b-a)/Math.abs(a)*100)}%`}][i-1])))}
function ageCalc(el){
 const today=new Date(),iso=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
 el.innerHTML=`<div class="row"><div><label for="dob">Date of birth</label><input id="dob" type="date" max="${iso}"></div><div><label for="ref">Reference date (optional)</label><input id="ref" type="date" value="${iso}"></div></div>
 <p><button class="btn" id="go">Calculate age</button></p><p class="res" id="out" aria-live="polite"></p>`;
 $('#go',el).onclick=()=>{const o=$('#out',el);o.className='res';const d=$('#dob',el).value,r=$('#ref',el).value||iso;
  if(!d){o.textContent='Please enter a date of birth.';o.className='res err';return}
  const [by,bm,bd]=d.split('-').map(Number),[ry,rm,rd]=r.split('-').map(Number);
  if(d>r){o.textContent='Date of birth cannot be after the reference date.';o.className='res err';return}
  let y=ry-by,m=rm-bm,dd=rd-bd;if(dd<0){m--;dd+=new Date(ry,rm-1,0).getDate()}if(m<0){y--;m+=12}
  const days=Math.round((Date.UTC(ry,rm-1,rd)-Date.UTC(by,bm-1,bd))/864e5);
  o.textContent=`${y} years, ${m} months, ${dd} days (${days.toLocaleString()} days in total)`}}
const U={Length:{base:'m',u:{mm:.001,cm:.01,m:1,km:1000,inch:.0254,foot:.3048,yard:.9144,mile:1609.344}},
 Mass:{u:{g:.001,kg:1,tonne:1000,ounce:.028349523125,pound:.45359237}},
 Area:{u:{'cm²':1e-4,'m²':1,'km²':1e6,hectare:1e4,'ft²':.09290304,acre:4046.8564224}},
 Volume:{u:{mL:.001,litre:1,'m³':1000,'US gallon':3.785411784,'US cup':.2365882365,'US fl oz':.0295735295625}},
 Time:{u:{second:1,minute:60,hour:3600,day:86400,week:604800}},
 Speed:{u:{'m/s':1,'km/h':1/3.6,mph:.44704,knot:1852/3600}},
 Temperature:{t:1,u:{'°C':1,'°F':1,K:1}}};
function unitConv(el){
 el.innerHTML=`<div class="row"><div><label for="cat">Category</label><select id="cat">${Object.keys(U).map(k=>`<option>${k}</option>`).join('')}</select></div></div>
 <div class="row"><div><label for="v">Value</label><input id="v" type="number" step="any" value="1"></div><div><label for="f">From</label><select id="f"></select></div><div><label for="to">To</label><select id="to"></select></div></div><p class="res" id="out" aria-live="polite"></p>`;
 const cat=$('#cat',el),f=$('#f',el),to=$('#to',el),v=$('#v',el),out=$('#out',el);
 const fill=()=>{const k=Object.keys(U[cat.value].u).map(x=>`<option>${x}</option>`).join('');f.innerHTML=to.innerHTML=k;to.selectedIndex=1;run()};
 const toC=(x,u)=>u==='°C'?x:u==='°F'?(x-32)*5/9:x-273.15,fromC=(c,u)=>u==='°C'?c:u==='°F'?c*9/5+32:c+273.15;
 function run(){const x=num(v.value);out.className='res';if(isNaN(x)){out.textContent='Enter a valid number.';out.className='res err';return}
  const c=U[cat.value];let r;
  if(c.t){const k=toC(x,f.value);if(k<-273.15-1e-9){out.textContent='Below absolute zero.';out.className='res err';return}r=fromC(k,to.value)}else r=x*c.u[f.value]/c.u[to.value];
  out.textContent=`${x} ${f.value} = ${clean(r)} ${to.value}`}
 cat.onchange=fill;[v,f,to].forEach(e=>e.oninput=run);fill()}

/* image tools */
const IMG_OK=['image/jpeg','image/png','image/webp'],IMG_MAX=25*1048576,PX_MAX=40e6;
function imgTool(el,mode){
 const rs=mode==='resize';
 el.innerHTML=`<div class="drop" id="dz"></div><div id="ws" hidden>
 <p id="info" role="status"></p><div class="row">
 ${rs?`<div><label for="w">Width (px)</label><input id="w" type="number" min="1"></div><div><label for="h">Height (px)</label><input id="h" type="number" min="1"></div><div><label for="lk">Aspect ratio</label><select id="lk"><option value="1">Locked</option><option value="0">Unlocked</option></select></div>`:`<div><label for="q">Quality: <span id="qv">75</span>%</label><input id="q" type="range" min="10" max="100" value="75"></div>`}
 <div><label for="fm">Output format</label><select id="fm"><option value="image/jpeg">JPEG</option><option value="image/webp">WebP</option><option value="image/png">PNG (lossless)</option></select></div></div>
 <p><button class="btn" id="go">${rs?'Resize':'Compress'}</button></p><p id="msg" aria-live="polite"></p><div id="rs" hidden><img class="pv" id="pv" alt="Result preview"><p id="ri"></p><button class="btn" id="dlb">Download</button></div></div>`;
 let img,file,blob;const msg=$('#msg',el);
 const err=t=>{msg.textContent=t;msg.className='err';say(t)};
 drop($('#dz',el),IMG_OK.join(','),false,async fs=>{const f=fs[0];if(!f)return;msg.textContent='';$('#rs',el).hidden=true;
  if(!IMG_OK.includes(f.type)){$('#ws',el).hidden=false;return err('Unsupported format. Use JPEG, PNG or WebP.')}
  if(f.size>IMG_MAX)return err('File is larger than 25 MB.');
  const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);if(i.naturalWidth*i.naturalHeight>PX_MAX)return err('Image is too large to process safely.');

function pdfSplit(el){
 el.innerHTML=`<div class="drop" id="dz"></div><div id="ws" hidden><p id="info" role="status"></p><label for="rg">Pages to extract</label><input id="rg" type="text" placeholder="e.g. 1-3, 5, 8-10" autocomplete="off"><p><button class="btn" id="go">Extract pages</button></p></div><p id="msg" aria-live="polite"></p>
 <p class="sub" style="text-align:left">Your PDF is processed on your device and never uploaded. Limit: 25 MB. Password-protected PDFs are not supported. Pages are exported in the order you list them.</p>`;
 let src=null,name='';const msg=$('#msg',el);
 drop($('#dz',el),'application/pdf',false,async fs=>{const f=fs[0];if(!f)return;msg.textContent='';msg.className='';src=null;$('#ws',el).hidden=true;

   $('#info',el).textContent=`${f.name} · ${src.getPageCount()} pages · ${fmtB(f.size)}`;$('#ws',el).hidden=false;say('PDF loaded')}

{id:'guide-compress-images',t:'How to compress images without losing quality',d:'Pick the right format and quality setting so photos stay sharp and files get smaller.',tool:'image-compressor',html:`
<p>Large images slow down pages, fill inboxes and break upload limits. The aim of compression is not the smallest possible file, it is the smallest file that still looks good for its purpose.</p>
<h2>1. Choose the right format</h2>
<ul><li><b>JPEG</b> suits photographs. It discards detail the eye barely notices.</li><li><b>WebP</b> usually produces smaller files than JPEG at similar quality and is supported by current browsers.</li><li><b>PNG</b> is lossless. It is best for logos, screenshots and graphics with sharp text, but photos saved as PNG stay large.</li></ul>
<h2>2. Resize before you compress</h2>
<p>A phone photo can be 4000 pixels wide, while most web pages show it at under 1600. Reducing the dimensions first with the <a href="#image-resizer">Image Resizer</a> often saves more than any quality setting.</p>
<h2>3. Start around 75% quality</h2>
<p>For JPEG and WebP, 70 to 85% is a sensible range. Compress, then compare the result with the original at full size. Look at faces, gradients such as skies, and text. If you see blocky patches or fuzzy edges, raise the quality a little.</p>
<h2>4. Keep your original</h2>
<p>Compression is not reversible. Work on a copy so you can start again if the result is not good enough.</p>
<p>How much a file shrinks depends on the image content, its format and your settings, so results vary from picture to picture.</p>`},
{id:'guide-merge-pdf',t:'How to merge PDF files into one document',d:'Combine several PDFs in the right order, and what to do when a file will not merge.',tool:'pdf-merger',html:`
<p>Applications, reports and invoices often arrive as several separate PDFs. Merging them gives you one file that is easier to send and store.</p>
<h2>Before you start</h2>
<ul><li>Rename or note the order you want, for example cover page, main report, appendix.</li><li>Remove password protection from any file first. Encrypted PDFs cannot be merged by this tool.</li><li>Check sizes. A merged file is roughly the sum of its parts, and email services often cap attachments around 20 to 25 MB.</li></ul>
<h2>Steps</h2>
<ol><li>Open the <a href="#pdf-merger">PDF Merger</a> and add your files.</li><li>Use the Up and Down buttons to set the order. Remove any file added by mistake.</li><li>Select Merge PDFs and download the result.</li><li>Open the merged file and scroll through it to confirm every page is present and in order.</li></ol>
<h2>If a file will not merge</h2>
<p>The most common causes are encryption or a damaged file. Try opening the PDF in a viewer and printing it to a new PDF, which often produces a clean copy. To take only some pages from a long document first, use the <a href="#pdf-splitter">PDF Splitter</a>.</p>`},
{id:'guide-qr-code',t:'How to create and test a QR code that scans reliably',d:'Choose the right content, keep strong contrast and always test before you print.',tool:'qr-code-generator',html:`
<p>A QR code simply stores text, such as a web address, in a pattern a phone camera can read. Most scanning failures come from low contrast, small size or content that was typed wrongly.</p>
<h2>Pick what to encode</h2>
<ul><li><b>URL:</b> use the full address starting with https://.</li><li><b>Wi-Fi:</b> lets guests join a network without typing the password. Anyone who scans it can read the password, so only share it where that is acceptable.</li><li><b>Contact:</b> adds a name, phone, email or website to a phone's address book.</li></ul>
<h2>Design for scanning</h2>
<ul><li>Use a dark code on a light background. Inverted or low-contrast colors often fail.</li><li>Keep the blank border around the code, called the quiet zone.</li><li>Shorter content makes a simpler pattern that is easier to scan at small sizes.</li><li>Print at least about 2 cm (0.8 inch) wide, and larger if people will scan from a distance.</li></ul>
<h2>Test before you print</h2>
<p>Scan the code with at least one phone, check that it opens the right destination, and try a second device if you can. Only then print or publish it. Generate yours with the <a href="#qr-code-generator">QR Code Generator</a>.</p>`},
{id:'guide-word-count',t:'How word and character counts work',d:'What counts as a word, how characters are measured and how reading time is estimated.',tool:'word-counter',html:`
<p>Essays, social posts and forms often have limits, but different tools can show slightly different numbers. Knowing the rules explains why.</p>
<h2>Words</h2>
<p>This site counts a word as any run of characters separated by spaces or line breaks. So "well-known" counts as one word, and "e-mail me" counts as three. Some word processors treat punctuation or hyphens differently, which can cause small gaps.</p>
<h2>Characters</h2>
<p>Characters with spaces include every letter, digit, symbol, space and line break. Characters without spaces leave out all whitespace. Platforms with a limit, such as a text-message or bio field, usually count spaces, so check which figure they use.</p>
<h2>Paragraphs</h2>
<p>A paragraph is a block of text separated from the next by a blank line. A single line break inside a block does not start a new paragraph.</p>
<h2>Reading time</h2>
<p>Reading time is an estimate: the word count divided by 200 words per minute, rounded up. Adults read at different speeds, and technical text takes longer than light text, so treat it as a guide.</p>
<p>Paste your text into the <a href="#word-counter">Word Counter</a> to see all of these figures update as you type. Your text stays in your browser.</p>`}
